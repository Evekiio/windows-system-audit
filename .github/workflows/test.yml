name: PowerShell tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1
        shell: powershell
        run: .\tests\run.ps1
      - name: PowerShell 7
        shell: pwsh
        run: .\tests\run.ps1
